name: Track upstream

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    uses: codeandsolder/ci-workflows/.github/workflows/upstream-tracking.yml@1ef8b180d04fbeb8c095e8d701f8a5107472370e # main
    with:
      upstream-repository: LaurenzV/hayro
      upstream-branch: main
      target-branch: main
      workflow-policy: preserve
      validation-script: .github/scripts/validate-upstream.sh
      rust-toolchain: repository
