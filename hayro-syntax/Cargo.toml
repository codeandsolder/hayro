[package]
name = "hayro-syntax"
version = "0.9.0"
description = "A low-level crate for reading PDF files."
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = "README.md"

[features]
default = ["std", "images"]
std = ["hayro-ccitt?/std", "hayro-jbig2?/std", "hayro-jpeg2000?/std", "dep:rustc-hash", "libjpeg-turbo-rs?/std"]
images = ["dep:libjpeg-turbo-rs", "dep:hayro-ccitt", "dep:hayro-jbig2", "dep:hayro-jpeg2000"]
unsafe = [
    "std",
    "dep:memchr",
    "hayro-jbig2?/simd",
    "hayro-jpeg2000?/simd",
    "libjpeg-turbo-rs?/simd",
]

[dependencies]
rustc-hash = { workspace = true, optional = true }
smallvec = { workspace = true }
zlib-rs = { workspace = true }
memchr = { workspace = true, optional = true }

libjpeg-turbo-rs = { workspace = true, optional = true }
hayro-ccitt = { workspace = true, optional = true }
hayro-jbig2 = { workspace = true, optional = true }
hayro-jpeg2000 = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
sha2 = "0.10"
md5 = "0.8"
aes = "0.8.4"
cbc = "0.1.2"
